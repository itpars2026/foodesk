name: food-reservation

services:
  db:
    container_name: db
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_reservation}
      POSTGRES_USER: ${POSTGRES_USER:-food_reservation}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS}

      RESERVATION_CUTOFF_HOUR: ${DOCKER_COMPOSE_RESERVATION_CUTOFF_HOUR:-10}

      POSTGRES_DB: ${POSTGRES_DB:-food_reservation}
      POSTGRES_USER: ${POSTGRES_USER:-food_reservation}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

    secrets:
      - django_secret_key
      - postgres_password
    volumes:
      - food_media:/app/media
      - django_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 3 \
          --access-logfile -
    expose:
      - "8000"
    networks:
      - backend
      - web
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - django_static:/srv/django-static:ro
      - food_media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
      - shared_net
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

  django_static:

  food_media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/food/media

networks:
  backend:
    driver: bridge
    name: food_reservation_internal
    internal: true
    ipam:
      config:
        - subnet: 172.20.7.0/24

  web:
    driver: bridge

  shared_net:
    external: true
    name: shared_net

secrets:
  django_secret_key:
    file: ./secrets/django_secret_key.txt

  postgres_password:
    file: ./secrets/postgres_password.txt
