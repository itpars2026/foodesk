name: food-reservation
services:
  db:
    container_name: db
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_reservation}
      POSTGRES_USER: ${POSTGRES_USER:-food_reservation}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
    - postgres_password
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - food_db_net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  backend:
    image: food-reservation-backend:${BACKEND_IMAGE_TAG:-latest}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    container_name: backend
    group_add:
      - "1000"
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key

      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS}

      RESERVATION_CUTOFF_HOUR: ${DOCKER_COMPOSE_RESERVATION_CUTOFF_HOUR:-10}

      POSTGRES_DB: ${POSTGRES_DB:-food_reservation}
      POSTGRES_USER: ${POSTGRES_USER:-food_reservation}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'

    secrets:
    - django_secret_key
    - postgres_password

    volumes:
    - food_media:/app/media
    - django_static:/app/staticfiles

    depends_on:
      db:
        condition: service_healthy

    command:
      - sh
      - -c
      - |
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 3 \
          --access-logfile -

    expose:
    - '8000'

    networks:
    - food_app_net
    - food_db_net

    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health',
        timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  frontend:
    image: food-reservation-frontend:${FRONTEND_IMAGE_TAG:-latest}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped

    volumes:
    - django_static:/srv/django-static:ro
    - food_media:/srv/media:ro

    depends_on:
      backend:
        condition: service_healthy

    networks:
      food_app_net: {}
      shared_net:
        aliases:
        - food-frontend

    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: null
  django_static: null
  food_media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/food/media

networks:
  food_app_net:
    name: food_app_net
    driver: bridge
  food_db_net:
    name: food_db_net
    driver: bridge
  shared_net:
    external: true
    name: shared_net

secrets:
  django_secret_key:
    file: ./secrets/django_secret_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
