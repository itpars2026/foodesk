name: Food Reservation CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.yaml'
      - 'compose.yml'
      - 'compose.yaml'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.yaml'
      - 'compose.yml'
      - 'compose.yaml'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: food-reservation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml

  publish:
    name: Publish | ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'

    environment: production

    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 25m
          envs: DEPLOY_SHA
          script: |
            set -eu

            cd /opt/food

            echo "Checking repository"

            test -z "$(git status --porcelain)" || {
              echo "Working tree is not clean"
              exit 1
            }

            test "$(git branch --show-current)" = "main" || {
              echo "Server must be on main"
              exit 1
            }

            echo "Fetching source"

            git fetch origin main

            REMOTE_SHA="$(git rev-parse origin/main)"

            if [ "$REMOTE_SHA" != "$DEPLOY_SHA" ]; then
              echo "Remote main changed; skipping old deployment"
              exit 1
            fi

            git merge --ff-only "$DEPLOY_SHA"

            echo "Validating Docker Compose"

            docker compose config --quiet

            echo "Building containers"

            docker compose build

            echo "Starting containers"

            docker compose up -d --no-build --wait --wait-timeout 120

            echo "Container status"

            docker compose ps

            echo "Deployment completed"
