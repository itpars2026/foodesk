name: Deployment Scripts CI

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployment scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax validation
        run: |
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -r -n 1 bash -n

      - name: Deployment safety regression tests
        run: bash scripts/test-deploy-safety.sh

      - name: ShellCheck
        run: |
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -r shellcheck --severity=warning
