name: VPS SSH Connectivity Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-test:
    name: Test SSH connection to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Inspect SSH host fingerprints
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 10 -p 22 -t rsa,ecdsa,ed25519 "$VPS_HOST" \
            2>/dev/null | ssh-keygen -lf - -E sha256
      - name: Connect to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          timeout: 30s
          command_timeout: 30s
          script: |
            set -eu
            echo "SSH_CONNECTION_SUCCESS"
            whoami
            hostname
            uptime
