name: VPS SSH Connectivity Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-test:
    name: Test SSH connection to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Connect to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          port: 22
          timeout: 30s
          command_timeout: 30s
          script: |
            set -eu
            echo "SSH_CONNECTION_SUCCESS"
            whoami
            hostname
            uptime
